<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon1.png?v=2">
  <title>Contacts · Massimo Bordogna</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- portfolio page specific: no thesis chrome, just a message + a way back ---- */
    .portfolio-content {
      position: absolute;
      left: var(--margin);
      right: var(--margin);
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
    }

    .portfolio-message {
      font-family: var(--body-font, 'PP Kyoto', serif);
      font-weight: var(--body-weight, 500);
      font-size: var(--serif-body);
      line-height: 1.1;
    }

    .portfolio-back {
      font-family: 'PP Neue Montreal Mono', monospace;
      font-weight: var(--mono-weight);
      font-size: var(--mono);
      color: var(--fg-dim);
    }
    .portfolio-back:hover {
      color: var(--fg);
    }

    @media (orientation: portrait) {
      .portfolio-content {
        position: static;
        height: 80vh;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="portfolio-content stack-item">
      <p class="portfolio-message">Massimo Bordogna’s contacts page is still under construction.<br>Check back soon.</p>
      <a class="portfolio-back" id="portfolioBack" href="index.html">[← Back to Current’s Wanderers]</a>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var from = params.get('from');
      var allowed = ['index.html', 'project-overview.html', 'video-essays.html', 'written-thesis.html', 'exhibitions.html', 'cultural-probes.html', 'documentation.html'];
      if (from && allowed.indexOf(from) !== -1) {
        document.getElementById('portfolioBack').href = from;
      }
    })();
  </script>
</body>
</html>
